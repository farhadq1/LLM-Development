[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-rag-agent"
version = "0.1.0"
description = "A PostgreSQL pgvector RAG assistant using the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.26,<1",
    "openai>=2,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
grounded-rag = "rag_agent:main"

[tool.setuptools]
py-modules = ["rag_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"